<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Backrooms Multijugador</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="vhs-overlay"></div>
    <div id="vignette"></div>
    <div id="red-vignette"></div>
    <div id="locker-overlay"></div>

    <div id="ui" style="display: none;">
        <div id="rec-ui"><div class="rec-dot"></div> REC</div>
        <div id="user-display" style="position:absolute; top:20px; left:120px; font-size:14px; color:#0f0;"></div>
        <div id="battery-ui">BAT <div id="battery"><div id="battery-fill"></div></div></div>
        <div id="level-ui">NIVEL 1</div>
        <div id="msg"></div>
    </div>

    <div id="controls" style="display: none;">
        <div id="joy"><div id="joyKnob"></div></div>
        <div id="actionBtns">
            <div id="hideBtn">ESCONDER</div>
            <div id="sprintBtn">CORRER</div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen">
        <h1>MINI MINI.EXE</h1>
        <input type="text" id="username" placeholder="USUARIO" maxlength="12">
        <input type="password" id="password" placeholder="CONTRASEÑA" maxlength="12">
        <button class="menuBtn" onclick="loginUser()">INICIAR SESIÓN</button>
        <button class="menuBtn" onclick="registerUser()">REGISTRARSE</button>
    </div>

    <!-- MAIN MENU -->
    <div id="mainMenu" class="screen" style="display:none;">
        <h1>MENÚ PRINCIPAL</h1>
        <p id="userPoints">Puntos: <span id="pointsVal">0</span></p>
        <button class="menuBtn" onclick="startSinglePlayer()">JUGAR SOLO</button>
        <button class="menuBtn" onclick="showScreen('multiplayerMenu')">MULTIJUGADOR</button>
        <button class="menuBtn" onclick="showScreen('monstersMenu')">SELECCIONAR MONSTRUO</button>
        <button class="menuBtn" onclick="showScreen('skinsMenu')">TIENDA DE SKINS</button>
        <button class="menuBtn" onclick="showScreen('settingsMenu')">CONFIGURACIÓN</button>
        <button class="menuBtn" style="background:#500; margin-top:20px;" onclick="logoutUser()">CERRAR SESIÓN</button>
    </div>

    <!-- SETTINGS MENU -->
    <div id="settingsMenu" class="screen" style="display:none;">
        <h2>CONFIGURACIÓN</h2>
        <div style="margin: 20px 0;">
            <p>Calidad Gráfica:</p>
            <div id="quality-buttons" style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                <button id="btnLow" class="quality-btn" onclick="setQuality('LOW')">Baja</button>
                <button id="btnMedium" class="quality-btn" onclick="setQuality('MEDIUM')">Media</button>
                <button id="btnHigh" class="quality-btn" onclick="setQuality('HIGH')">Alta 🔒</button>
            </div>
        </div>
        <button class="menuBtn" style="margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- MONSTERS MENU -->
    <div id="monstersMenu" class="screen" style="display:none;">
        <h2>SELECCIONA TU PESADILLA</h2>
        <div class="skin-container" id="monsterList"></div>
        <button class="menuBtn" style="margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- MULTIPLAYER MENU -->
    <div id="multiplayerMenu" class="screen" style="display:none;">
        <h2>MULTIJUGADOR</h2>
        <button class="menuBtn" onclick="hostGame()">CREAR SALA</button>
        <div id="hostCodeContainer" style="display:none; margin: 20px 0; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;">
            <p>Código:</p>
            <h1 id="hostCodeDisplay" style="color: #ffd23f; font-size: 40px;">----</h1>
            <button class="menuBtn" style="background: #00ff55; color: #000;" onclick="startHostGame()">EMPEZAR JUEGO</button>
        </div>
        <p>O únete:</p>
        <input type="text" id="joinCodeInput" placeholder="CÓDIGO" maxlength="4" style="text-transform: uppercase;">
        <button class="menuBtn" onclick="joinGame()">UNIRSE</button>
        <button class="menuBtn" style="background: transparent; border: none; color: #aaa;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- SKINS MENU -->
    <div id="skinsMenu" class="screen" style="display:none;">
        <h2>TIENDA DE SKINS</h2>
        <div class="skin-container" id="skinsList"></div>
        <button class="menuBtn" style="margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "./three.module.js" } }
    </script>
    <script type="module" src="game.js"></script>
    <script type="module" src="auth.js"></script>
</body>
</html>
