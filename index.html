<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Backrooms & Forest - Horror</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="vhs-overlay"></div>
    <div id="vignette"></div>
    <div id="red-vignette"></div>

    <div id="ui">
        <div id="rec-ui"><div class="rec-dot"></div> REC</div>
        <div id="battery-ui">BAT <div id="battery"><div id="battery-fill"></div></div></div>
        <div id="level-ui">NIVEL 1</div>
        <div id="msg"></div>
    </div>

    <div id="controls">
        <div id="joy"><div id="joyKnob"></div></div>
        <div id="actionBtns">
            <div id="hideBtn">ESCONDER</div>
            <div id="sprintBtn">CORRER</div>
        </div>
    </div>

    <div id="startScreen">
        <h1 id="title">MINI MINI.EXE</h1>
        <p id="desc">
            Encuentra las 3 cintas VHS.<br>
            Si ves a la criatura, <b>MÍRALA FIJAMENTE</b>.<br>
            Escóndete en los <b>casilleros</b> con la tecla <b>E</b> o el botón.
        </p>
        <button id="startBtn">JUGAR</button>
        <p style="margin-top:16px;font-size:12px;color:#888;">PC: Click para mirar · WASD + Shift · E</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module" src="game.js"></script>
</body>
</html>
