<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Backrooms - Multijugador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="vhs-overlay"></div>
    <div id="vignette"></div>
    <div id="red-vignette"></div>
    <div id="locker-overlay"></div>

    <div id="ui" style="display: none;">
        <div id="rec-ui"><div class="rec-dot"></div> REC</div>
        <div id="battery-ui">BAT <div id="battery"><div id="battery-fill"></div></div></div>
        <div id="level-ui">NIVEL 1</div>
        <div id="msg"></div>
    </div>

    <div id="controls" style="display: none;">
        <div id="joy"><div id="joyKnob"></div></div>
        <div id="actionBtns">
            <div id="hideBtn">ESCONDER</div>
            <div id="sprintBtn">CORRER</div>
        </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <div id="mainMenu" class="screen">
        <h1>MINI MINI.EXE</h1>
        <p id="userPoints">Puntos: <span id="pointsVal">0</span></p>
        <button class="menuBtn" onclick="startSinglePlayer()">JUGAR SOLO</button>
        <button class="menuBtn" onclick="showScreen('multiplayerMenu')">MULTIJUGADOR</button>
        <button class="menuBtn" onclick="showScreen('skinsMenu')">TIENDA DE SKINS</button>
        <button class="menuBtn" onclick="showScreen('settingsMenu')">CONFIGURACIÓN</button>
    </div>

    <!-- MULTIJUGADOR -->
    <div id="multiplayerMenu" class="screen" style="display:none;">
        <h2>MULTIJUGADOR</h2>
        <button class="menuBtn" onclick="hostGame()">CREAR SALA</button>
        <div id="hostCodeContainer" style="display:none; margin: 20px 0;">
            <p>Pásale este código a tus amigos:</p>
            <h1 id="hostCodeDisplay" style="color: #ffd23f; font-size: 40px; letter-spacing: 5px;"></h1>
        </div>
        <p>O únete a una:</p>
        <input type="text" id="joinCodeInput" placeholder="CÓDIGO" maxlength="4" style="text-transform: uppercase;">
        <button class="menuBtn" onclick="joinGame()">UNIRSE</button>
        <button class="menuBtn" style="background: transparent; border: none; color: #aaa; margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- SKINS -->
    <div id="skinsMenu" class="screen" style="display:none;">
        <h2>TIENDA DE SKINS</h2>
        <div class="skin-container">
            <div class="skin-card">
                <div style="width:50px; height:50px; background:blue; border-radius:50%; margin:0 auto 10px;"></div>
                <p>Azul (Gratis)</p>
                <button onclick="buySkin('blue', 0)">EQUIPAR</button>
            </div>
            <div class="skin-card">
                <div style="width:50px; height:50px; background:red; border-radius:50%; margin:0 auto 10px;"></div>
                <p>Rojo (100 pts)</p>
                <button onclick="buySkin('red', 100)">COMPRAR</button>
            </div>
            <div class="skin-card">
                <div style="width:50px; height:50px; background:green; border-radius:50%; margin:0 auto 10px;"></div>
                <p>Verde (250 pts)</p>
                <button onclick="buySkin('green', 250)">COMPRAR</button>
            </div>
        </div>
        <button class="menuBtn" style="margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- CONFIGURACIÓN -->
    <div id="settingsMenu" class="screen" style="display:none;">
        <h2>CONFIGURACIÓN</h2>
        <label>Sensibilidad de Cámara:</label>
        <input type="range" id="sensitivity" min="1" max="10" value="5" style="width: 80%; margin: 15px 0;">
        <label>Volumen:</label>
        <input type="range" id="volume" min="0" max="100" value="50" style="width: 80%; margin: 15px 0;">
        <button class="menuBtn" onclick="saveSettings()">GUARDAR</button>
        <button class="menuBtn" style="margin-top: 20px;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>

    <!-- Usamos la versión online para asegurar que cargue rápido -->
    <script type="importmap">
        { "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "peerjs": "https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"
        } }
    </script>
    
    <!-- Funciones de UI globales (para que los botones funcionen siempre) -->
    <script>
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'flex';
        }
        function saveSettings() { showScreen('mainMenu'); }
    </script>
    
    <script type="module" src="game.js"></script>
</body>
</html>
